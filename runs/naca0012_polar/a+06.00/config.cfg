% SU2 configuration template for 2D compressible RANS around an airfoil.
% Generated by nacacfd from src/nacacfd/airfoil/templates/su2_rans_compressible.cfg.
% Based on SU2 v8.5.0 TestCases/rans/naca0012/turb_NACA0012_sa.cfg (SU2, LGPL-2.1).
% Deliberate differences from that file: no restart, standard SA (no SA_OPTIONS),
% aerodynamic coefficients in the history file, surface CSV output (Cp, Cf, y+),
% CONV_STARTITER used as a minimum iteration count (see decisions D-011).
%
SOLVER= RANS
KIND_TURB_MODEL= SA

MATH_PROBLEM= DIRECT
RESTART_SOL= NO
%
MACH_NUMBER= 0.15
AOA= 6.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 6000000.0
REYNOLDS_LENGTH= 1.0
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE
%
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
NUM_METHOD_GRAD_RECON= LEAST_SQUARES
CFL_NUMBER= 1000.0
CFL_ADAPT= NO
MAX_DELTA_TIME= 1E10
ITER= 20000
VENKAT_LIMITER_COEFF= 0.03
LIMITER_ITER= 99999
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-10
LINEAR_SOLVER_ITER= 20
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
MUSCL_KAPPA_FLOW= 0.5
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= YES
MUSCL_KAPPA_TURB= 0.0
SLOPE_LIMITER_TURB= NONE
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 1.0
%
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 2000
%
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE)
% NO = write all fields to all files; needed for Cp, Cf and y+ in surface_flow.csv
WRT_RESTART_COMPACT= NO
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
OUTPUT_WRT_FREQ= 100000
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)
SCREEN_WRT_FREQ_INNER= 100
