[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nacacfd"
version = "0.0.1"
description = "Agent-driven, validated 2D RANS workflow for NACA airfoils (SU2 + Gmsh)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# numpy/scipy/pandas/matplotlib/gmsh are added when the code that needs them is implemented (F2+).
dev = ["pytest>=8"]

[project.scripts]
nacacfd = "nacacfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
