# F2b: one case end to end on our own Gmsh mesh (geometry -> mesh -> SU2 -> QA).
# Compare with the external-mesh baselines naca0012_a5_su2grid*.yaml.
name: naca0012_a5_smoke
airfoil: NACA0012
geometry_variant: standard_closed_te   # NASA TMR variant not implemented (definition not verified)
alpha_deg: [5.0]
reynolds: 6.0e6
mach: 0.15
turbulence_model: SA
mesh_level: medium
mesh:
  source: gmsh
  target_yplus: 0.5   # design value; the flat-plate estimate underpredicts y+ near the leading edge (attempt 001: max 2.19)
  farfield_radius_chords: 100.0
solver:
  n_procs: 4
required_gates: [mesh_quality, wall_yplus, convergence, physics_flags]
notes: "Smoke test on our own mesh. Not validated (no validation gate yet)."
