# F4b: grid study with a 4th (extra-fine) level, alpha 5 only. The GCI gate uses the three finest levels
# (xfine, fine, medium); the coarse case is kept to show the whole sequence.
name: naca0012_gci4
airfoil: NACA0012
geometry_variant: standard_closed_te
alpha_deg: [5.0]
reynolds: 6.0e6
mach: 0.15
turbulence_model: SA
mesh_level: medium
mesh_levels: [xfine, fine, medium, coarse]
mesh:
  source: gmsh
  target_yplus: 0.5
  farfield_radius_chords: 100.0
solver:
  n_procs: 4
required_gates: [mesh_quality, wall_yplus, convergence, physics_flags, gci]
notes: "F4b diagnosis of the non-converging CL in naca0012_gci (Finding F4-1). Same settings plus xfine."
